name: conformance

on:
  push:
    branches: [main, devel]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - name: Run every check
        run: python -B tools/conformance/run_all.py
      - name: Run the tests
        run: python -B -m pytest -q tests
      - name: Build the release
        run: python -B tools/release/build.py --version 1.0.0-draft.0 "$RUNNER_TEMP/dist"
      - name: Every commit has the project identity
        if: github.event_name == 'push'
        run: python -B tools/conformance/check_identity.py
