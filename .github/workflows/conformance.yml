name: conformance

on:
  push:
    branches: [main, devel]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - name: Run every check
        run: python -B tools/conformance/run_all.py
      - name: Run the tests
        run: python -B -m pytest -q tests
      - name: Every commit has the project identity
        if: github.event_name == 'push'
        run: |
          expected='Rubedyne <info@rubedyne.com>|Rubedyne <info@rubedyne.com>'
          found=$(git log --format='%an <%ae>|%cn <%ce>' | sort -u)
          if [ "$found" != "$expected" ]; then
            echo "Unexpected author or committer identities:"
            echo "$found"
            exit 1
          fi
